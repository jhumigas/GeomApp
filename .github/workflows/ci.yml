name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same Java major version as .tool-versions
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Test
        run: make test MVN="mvn -B"

      - name: Package
        run: make package MVN="mvn -B -DskipTests"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: geomapp-jar
          path: target/geomapp-*.jar
          if-no-files-found: error
